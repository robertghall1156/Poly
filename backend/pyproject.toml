[project]
name = "poly-backend"
version = "0.1.0"
description = "Poly — local-first political intelligence & content operating system (backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "feedparser>=6.0",
  "trafilatura>=1.9",
  "python-dateutil>=2.9",
  "huey>=2.5",
  "numpy>=1.26",
  "pillow>=10.3",
  "python-multipart>=0.0.9",
  "pgvector>=0.3",
  "psycopg[binary]>=3.1",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
# Local transcription — choose one. mlx-whisper is the fastest on Apple Silicon.
mlx = ["mlx-whisper>=0.4"]
whisper = ["faster-whisper>=1.0"]
# Face tracking for 9:16 auto-crop
vision = ["opencv-python-headless>=4.9"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
poly = "poly.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["poly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py311"
